# Netlify builds only the app in /app. Your notes are never part of the website.
[build]
  base = "app"
  command = "npm run build"
  publish = "dist"
  # Every note sync is a commit. Skip the build when a commit doesn't touch app/.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"

# Let installed copies find app updates right away.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
