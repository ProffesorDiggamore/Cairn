<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Cairn</title>
    <meta name="description" content="Notion-style notes on plain Markdown files, synced through your own GitHub." />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cairn" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the theme before first paint so there's no flash.
      try {
        var s = JSON.parse(localStorage.getItem('cairn.settings.v1') || '{}')
        var t = s.theme || 'system'
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        var r = document.documentElement
        r.dataset.theme = t
        r.dataset.palette = s.palette || 'default'
        if (s.accent) {
          r.dataset.accent = ''
          r.style.setProperty('--accent', s.accent)
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
